name: Import NeuralFoil project

on:
  push:
    paths:
      - .github/workflows/import-project.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4

      - name: Copy NeuralFoil files from the personal site repository
        run: |
          git clone --depth 1 https://github.com/KaanBoge/kaanboge.github.io.git source
          cp source/neuralfoil-studio.html index.html
          cp source/gen_dataset.py gen_dataset.py
          rm -rf study
          cp -R source/neuralfoil-study study
          touch .nojekyll
          printf '%s\n' '# NeuralFoil' '' 'Interactive NeuralFoil Studio and the experimental validation study.' '' '- [Open NeuralFoil Studio](https://kaanboge.github.io/neuralfoil/)' '- [Browse the study files](study/)' > README.md
          rm -rf source
          git config user.name "KaanBoge"
          git config user.email "294922497+KaanBoge@users.noreply.github.com"
          git add -A
          git commit -m "Move NeuralFoil Studio and study into dedicated repository"
          git push
